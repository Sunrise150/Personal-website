<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>扫雷 - 日出的blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=6">
  <script>if (window.top !== window.self) document.documentElement.classList.add('is-framed');</script>
  <style>
    body { overscroll-behavior: contain; }
    .ms-wrap {
      max-width: 640px;
      margin: 24px auto;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }
    .ms-wrap h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .ms-hint {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .ms-stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .ms-stats strong { color: var(--accent); }
    .ms-difficulty {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .ms-difficulty button {
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }
    .ms-difficulty button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .ms-board {
      display: inline-grid;
      gap: 2px;
      background: var(--border);
      border: 2px solid var(--border);
      border-radius: 6px;
      padding: 4px;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    .ms-cell {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      border-radius: 3px;
      cursor: pointer;
      background: #d6d3d1;
      color: #1c1917;
      transition: background 0.1s;
    }
    .ms-cell:hover:not(.revealed) { background: #e7e5e4; }
    .ms-cell.revealed {
      background: var(--bg);
      cursor: default;
    }
    .ms-cell.mine {
      background: #ef4444;
      color: #fff;
    }
    .ms-cell.flagged { background: #fde68a; }
    .ms-cell.wrong-flag { background: #fca5a5; }
    .ms-cell[data-n="1"] { color: #2563eb; }
    .ms-cell[data-n="2"] { color: #16a34a; }
    .ms-cell[data-n="3"] { color: #dc2626; }
    .ms-cell[data-n="4"] { color: #7c3aed; }
    .ms-cell[data-n="5"] { color: #b45309; }
    .ms-cell[data-n="6"] { color: #0891b2; }
    .ms-cell[data-n="7"] { color: #1c1917; }
    .ms-cell[data-n="8"] { color: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .ms-cell { background: #44403c; color: #f5f5f4; }
      .ms-cell:hover:not(.revealed) { background: #57534e; }
      .ms-cell.revealed { background: var(--bg); }
      .ms-cell.flagged { background: #854d0e; }
    }
    .ms-controls {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .ms-btn {
      padding: 8px 20px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .ms-btn.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .ms-result {
      margin-top: 12px;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      display: none;
    }
    .ms-result.win { background: #22c55e; color: #fff; display: inline-block; }
    .ms-result.lose { background: #ef4444; color: #fff; display: inline-block; }
    @media (max-width: 480px) {
      .ms-cell { width: 24px; height: 24px; font-size: 12px; }
      /* 困难模式 16×30 在小屏进一步缩小 */
      .ms-board[data-level="hard"] .ms-cell { width: 19px; height: 19px; font-size: 11px; }
    }
    @media (max-width: 360px) {
      .ms-cell { width: 20px; height: 20px; font-size: 11px; }
      .ms-board[data-level="hard"] .ms-cell { width: 16px; height: 16px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-title" id="site-title"></a>
      <nav>
        <a href="index.html">文章</a>
        <a href="write.html">写文章</a>
        <a href="manage.html">管理</a>
        <a href="music.html">音乐</a>
        <a href="rooms.html">房间人数查看</a>
        <a href="games.html">游戏</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="ms-wrap">
      <h1>扫雷</h1>
      <p class="ms-hint">左键/点击揭开，右键/长按标旗。数字表示周围 8 格的雷数。</p>
      <div class="ms-difficulty">
        <button data-level="easy" class="active">简单 9×9 · 10雷</button>
        <button data-level="medium">中等 16×16 · 40雷</button>
        <button data-level="hard">困难 16×30 · 99雷</button>
      </div>
      <div class="ms-stats">
        <div>💣 <strong id="ms-mines">10</strong></div>
        <div>⏱ <strong id="ms-time">0</strong>s</div>
        <div>🏆 <strong id="ms-best">—</strong></div>
      </div>
      <div id="ms-board" class="ms-board"></div>
      <div id="ms-result" class="ms-result"></div>
      <div class="ms-controls">
        <button id="ms-restart" class="ms-btn">重新开始</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p id="footer-text"></p></div>
  </footer>

  <script src="assets/js/config.js?v=3"></script>
  <script src="assets/js/minesweeper.js?v=1"></script>
  <script src="assets/js/player.js?v=14"></script>
</body>
</html>
