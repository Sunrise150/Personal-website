<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap"></noscript>
  <link rel="stylesheet" href="assets/css/style.css?v=6">
  <script>try { var _t = localStorage.getItem('blog-theme') || 'light'; if (_t !== 'auto') document.documentElement.setAttribute('data-theme', _t); } catch(e) {}</script>
  <script>if (window.top !== window.self) document.documentElement.classList.add('is-framed');</script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-title" id="site-title"></a>
      <nav>
        <a href="index.html">文章</a>
        <a href="write.html">写文章</a>
        <a href="manage.html">管理</a>
        <a href="music.html">音乐</a>
        <a href="rooms.html">房间人数查看</a>
        <a href="games.html">游戏</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-title-row">
      <h1 class="page-title">音乐管理</h1>
      <button type="button" class="page-refresh-btn" id="music-refresh" title="刷新音乐列表">↻ 刷新</button>
    </div>
    <p class="hint" style="margin-bottom:20px;">
      上传后会把文件存到 assets/music/，并更新 data/music.json。约 1 分钟后全站生效。
    </p>

    <form id="music-form" class="write-form">
      <div class="field">
        <label>选择音乐文件</label>
        <div class="file-row">
          <input type="file" id="m-file" accept="audio/*,.mp3,.m4a,.ogg,.wav,.flac,.aac" hidden>
          <button type="button" id="m-file-pick" class="ghost-btn">选择文件</button>
          <span class="hint" id="m-file-name">支持 mp3 / m4a / ogg / wav / flac / aac，单个不超过 25MB</span>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="m-name">歌名</label>
          <input id="m-name" type="text" placeholder="留空则用文件名">
        </div>
        <div class="field">
          <label for="m-artist">艺术家（选填）</label>
          <input id="m-artist" type="text" placeholder="歌手 / 作者">
        </div>
      </div>

      <div class="actions">
        <button type="submit" id="m-submit">上传</button>
      </div>
      <!-- 进度条 -->
      <div id="m-progress-bar" style="display:none;margin-top:12px;">
        <div style="background:var(--border);border-radius:6px;height:8px;overflow:hidden;">
          <div id="m-progress-fill" style="width:0%;height:100%;background:linear-gradient(90deg,var(--accent),#a78bfa);transition:width .2s ease;"></div>
        </div>
        <div id="m-progress-text" style="font-size:12px;color:var(--text-muted);margin-top:4px;">0%</div>
      </div>
      <div id="m-status" class="status"></div>
    </form>

    <!-- 高级设置（Git Data API 需要 branch） -->
    <details style="margin-top:16px;font-size:12px;">
      <summary style="cursor:pointer;color:var(--text-muted);user-select:none;">高级设置：Git 分支名</summary>
      <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
        <input id="m-branch" type="text" placeholder="main" style="flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:12px;">
        <button type="button" id="m-branch-save" class="ghost-btn" style="font-size:12px;padding:6px 12px;">保存</button>
      </div>
      <div style="margin-top:4px;color:var(--text-muted);font-size:11px;">Git Data API 上传大文件需要知道目标分支。默认 main，老仓库可能是 master。</div>
    </details>

    <h2 class="page-title" style="font-size:22px;margin-top:32px;">音乐列表</h2>
    <div class="manage-toolbar">
      <input type="text" id="music-search" class="manage-search" placeholder="搜索歌名、艺术家…" autocomplete="off">
      <span id="music-count" class="manage-count"></span>
    </div>
    <div id="music-admin-list" class="manage-list">
      <div class="loading">加载中…</div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p id="footer-text"></p></div>
  </footer>

  <script src="assets/js/config.js?v=3" defer></script>
  <script src="assets/js/music-manage.js?v=3" defer></script>
  <script src="assets/js/player.js?v=13" defer></script>
</body>
</html>
