<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>博客问答 - 日出的blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=6">
  <script>try { var _t = localStorage.getItem('blog-theme') || 'light'; if (_t !== 'auto') document.documentElement.setAttribute('data-theme', _t); } catch(e) {}</script>
  <script>if (window.top !== window.self) document.documentElement.classList.add('is-framed');</script>
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; background: var(--bg); color: var(--text); overscroll-behavior: contain; }
    .ai-wrap { flex: 1; display: flex; flex-direction: column; max-width: 720px; width: 100%; margin: 0 auto; padding: 16px; box-sizing: border-box; }
    .ai-header { text-align: center; margin-bottom: 12px; }
    .ai-header h1 { font-family: 'Noto Serif SC', serif; font-size: 22px; margin: 0; color: #fafaf9; }
    .ai-header p { font-size: 12px; color: #78716c; margin: 4px 0 0; }
    .ai-chat { flex: 1; overflow-y: auto; background: #1c1917; border: 1px solid #292524; border-radius: 12px; padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 60vh; max-height: 70vh; }
    .ai-msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 14px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
    .ai-msg.user { align-self: flex-end; background: #60a5fa; color: #0c0a09; border-bottom-right-radius: 4px; }
    .ai-msg.bot { align-self: flex-start; background: #292524; color: #fafaf9; border-bottom-left-radius: 4px; border: 1px solid #44403c; }
    .ai-msg.err { align-self: flex-start; background: #7f1d1d; color: #fecaca; border-bottom-left-radius: 4px; }
    .ai-loading { display: inline-block; padding: 6px 12px; color: #a8a29e; font-size: 13px; }
    .ai-loading span { display: inline-block; animation: ai-blink 1.2s infinite; }
    .ai-loading span:nth-child(2) { animation-delay: 0.2s; }
    .ai-loading span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes ai-blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
    .ai-input { display: flex; gap: 8px; }
    .ai-input textarea { flex: 1; resize: none; padding: 10px 12px; border-radius: 10px; border: 1px solid #292524; background: #1c1917; color: #fafaf9; font-size: 14px; line-height: 1.4; min-height: 42px; max-height: 120px; font-family: inherit; }
    .ai-input textarea:focus { outline: none; border-color: #60a5fa; }
    .ai-input button { padding: 0 20px; border-radius: 10px; border: 0; background: #60a5fa; color: #0c0a09; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .ai-input button:disabled { opacity: 0.5; cursor: not-allowed; }
    .ai-reset { text-align: center; margin-top: 8px; }
    .ai-reset button { background: transparent; border: 1px solid #44403c; color: #a8a29e; padding: 4px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .ai-reset button:hover { color: #fafaf9; border-color: #78716c; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-title" id="site-title"></a>
      <nav>
        <a href="index.html">文章</a>
        <a href="write.html">写文章</a>
        <a href="manage.html">管理</a>
        <a href="music.html">音乐</a>
        <a href="rooms.html">房间人数查看</a>
        <a href="games.html">游戏</a>
      </nav>
    </div>
  </header>

  <main class="ai-wrap">
    <div class="ai-header">
      <h1>🤖 博客问答</h1>
      <p class="ai-hint" style="font-size:12px;color:#78716c;margin:4px 0 0;line-height:1.5;">
        基于博客文章内容的智能问答。问我关于博客的任何问题，我会从文章里帮你找答案。
      </p>
    </div>
    <div class="ai-chat" id="ai-chat">
      <div class="ai-msg bot">你好呀～问我关于博客内容的任何问题！\n比如：怎么写文章？有什么游戏？</div>
    </div>
    <div class="ai-input">
      <textarea id="ai-input" placeholder="问我关于博客的任何问题..." rows="1"></textarea>
      <button id="ai-send">发送</button>
    </div>
    <div class="ai-reset"><button id="ai-reset">清空对话</button></div>
  </main>

  <footer class="site-footer">
    <div class="container"><p id="footer-text"></p></div>
  </footer>

  <script src="assets/js/config.js?v=3"></script>
  <script src="assets/js/ai.js?v=5"></script>
</body>
</html>
