<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>推箱子 - 日出的blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=6">
  <script>if (window.top !== window.self) document.documentElement.classList.add('is-framed');</script>
  <style>
    body { overscroll-behavior: contain; }
    .sk-wrap {
      max-width: 520px;
      margin: 24px auto;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }
    .sk-wrap h1 { font-family: 'Noto Serif SC', serif; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .sk-hint { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .sk-stats {
      display: flex; justify-content: center; gap: 20px;
      margin-bottom: 8px; font-size: 13px;
    }
    .sk-stats strong { color: var(--accent); }
    #sk-board {
      display: inline-block;
      background: #1c1917;
      border: 2px solid var(--border);
      border-radius: 4px;
      padding: 2px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .sk-row { display: flex; }
    .sk-cell {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; line-height: 1;
      transition: background 0.1s;
    }
    .sk-cell.wall { background: #57534e; border: 1px solid #44403c; }
    .sk-cell.floor { background: #fafaf9; }
    .sk-cell.target { background: #fef3c7; }
    .sk-cell.box { background: #fafaf9; color: #92400e; font-size: 20px; }
    .sk-cell.box-on-target { background: #bbf7d0; color: #166534; font-size: 20px; }
    .sk-cell.player { background: #dbeafe; color: #1e40af; font-size: 18px; }
    .sk-cell.player-on-target { background: #fde68a; color: #92400e; font-size: 18px; }
    @media (prefers-color-scheme: dark) {
      .sk-cell.floor { background: #292524; }
      .sk-cell.target { background: #451a03; }
      .sk-cell.box { background: #292524; color: #fbbf24; }
      .sk-cell.box-on-target { background: #14532d; color: #86efac; }
      .sk-cell.player { background: #1e3a5f; color: #93c5fd; }
      .sk-cell.player-on-target { background: #78350f; color: #fcd34d; }
    }
    .sk-controls {
      margin-top: 12px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
    }
    .sk-btn {
      padding: 8px 16px; background: var(--accent); color: #fff; border: 0;
      border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .sk-btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .sk-levels {
      margin-top: 10px; display: flex; justify-content: center; gap: 4px; flex-wrap: wrap;
    }
    .sk-level {
      width: 28px; height: 28px; font-size: 12px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface);
      cursor: pointer; color: var(--text);
    }
    .sk-level.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .sk-level.done { background: #22c55e; color: #fff; border-color: #22c55e; }
    .sk-win {
      margin-top: 8px; padding: 8px 16px; background: #22c55e; color: #fff;
      border-radius: 8px; font-weight: 700; display: none;
    }
    .sk-win.show { display: inline-block; }
    .sk-dpad {
      display: none; margin: 12px auto 0;
      grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px);
      gap: 6px; justify-content: center;
    }
    .sk-dpad button {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; font-size: 20px; cursor: pointer; color: var(--text);
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .sk-dpad button:active { background: var(--accent); color: #fff; }
    .sk-dpad .up { grid-column: 2; grid-row: 1; }
    .sk-dpad .left { grid-column: 1; grid-row: 2; }
    .sk-dpad .right { grid-column: 3; grid-row: 2; }
    .sk-dpad .down { grid-column: 2; grid-row: 3; }
    @media (max-width: 600px) {
      .sk-dpad { display: grid; }
      .sk-cell { width: 24px; height: 24px; font-size: 15px; }
    }
    @media (max-width: 400px) {
      .sk-cell { width: 20px; height: 20px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-title" id="site-title"></a>
      <nav>
        <a href="index.html">文章</a>
        <a href="write.html">写文章</a>
        <a href="manage.html">管理</a>
        <a href="music.html">音乐</a>
        <a href="rooms.html">房间人数查看</a>
        <a href="games.html">游戏</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="sk-wrap">
      <h1>推箱子</h1>
      <p class="sk-hint">方向键/WASD 移动，把 📦 推到 ⭐ 位置。Z 撤销，R 重置。</p>
      <div class="sk-stats">
        <div>关卡：<strong id="sk-lv">1</strong></div>
        <div>步数：<strong id="sk-steps">0</strong></div>
      </div>
      <div id="sk-board"></div>
      <div id="sk-win" class="sk-win">通关！🎉 按 N 下一关</div>
      <div class="sk-controls">
        <button id="sk-undo" class="sk-btn secondary">撤销 (Z)</button>
        <button id="sk-reset" class="sk-btn secondary">重置 (R)</button>
        <button id="sk-prev" class="sk-btn secondary">上一关</button>
        <button id="sk-next" class="sk-btn secondary">下一关</button>
      </div>
      <div id="sk-levels" class="sk-levels"></div>
      <div class="sk-dpad">
        <button class="up" data-dir="up">▲</button>
        <button class="left" data-dir="left">◀</button>
        <button class="right" data-dir="right">▶</button>
        <button class="down" data-dir="down">▼</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p id="footer-text"></p></div>
  </footer>

  <script src="assets/js/config.js?v=3"></script>
  <script src="assets/js/sokoban.js?v=1"></script>
  <script src="assets/js/player.js?v=15"></script>
</body>
</html>
