<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写文章</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-title" id="site-title"></a>
      <nav>
        <a href="index.html">文章</a>
        <a href="write.html" class="active">写文章</a>
        <a href="manage.html">管理</a>
        <a href="music.html">音乐</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">写新文章</h1>
    <form id="write-form" class="write-form">
      <div class="field">
        <label for="title">标题</label>
        <input id="title" type="text" required placeholder="文章标题">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="date">日期</label>
          <input id="date" type="date" required>
        </div>
        <div class="field">
          <label for="tags">标签（逗号分隔）</label>
          <input id="tags" type="text" placeholder="随笔, 学习">
        </div>
      </div>

      <div class="field">
        <label for="excerpt">摘要（选填，显示在首页）</label>
        <textarea id="excerpt" rows="2" placeholder="一两句话介绍这篇文章"></textarea>
      </div>

      <div class="field">
        <label>插入图片</label>
        <div id="image-drop" class="image-drop">
          <input type="file" id="image-input" accept="image/*" multiple hidden>
          <button type="button" id="image-pick" class="ghost-btn">选择图片</button>
          <span class="hint">也可以直接粘贴、或拖拽图片到这里</span>
        </div>
        <div id="image-list" class="image-list"></div>
      </div>

      <div class="field">
        <label>上传附件（压缩包）</label>
        <div class="file-row">
          <input type="file" id="file-input" accept=".zip,.rar,.7z,.tar,.gz,.tgz,.xz,.bz2" hidden>
          <button type="button" id="file-pick" class="ghost-btn">选择压缩包</button>
          <span class="hint">支持 zip / rar / 7z / tar.gz 等，单个不超过 25MB</span>
        </div>
        <div id="file-list" class="image-list"></div>
      </div>

      <div class="field">
        <label for="body">正文（支持 Markdown）</label>
        <textarea id="body" rows="18" required placeholder="# 标题&#10;&#10;正文内容……"></textarea>
      </div>

      <div class="actions">
        <button type="submit" id="submit-btn">发布</button>
        <a href="index.html" class="cancel-link">取消</a>
        <button type="button" id="open-settings" class="ghost-btn">设置</button>
      </div>
      <div id="status" class="status"></div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container"><p id="footer-text"></p></div>
  </footer>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-content">
      <h2>首次使用设置</h2>
      <p>只需填写一次，保存在本地浏览器，不会上传到别处。</p>
      <div class="field">
        <label for="cfg-owner">GitHub 用户名</label>
        <input id="cfg-owner" type="text" placeholder="your-username">
      </div>
      <div class="field">
        <label for="cfg-repo">仓库名</label>
        <input id="cfg-repo" type="text" placeholder="my-blog">
      </div>
      <div class="field">
        <label for="cfg-token">Personal Access Token</label>
        <input id="cfg-token" type="password" placeholder="ghp_...">
        <p class="hint">需要 repo 权限（或 public_repo）。只在你的浏览器里保存。</p>
      </div>
      <div class="actions">
        <button id="cfg-save" type="button">保存</button>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js?v=3"></script>
  <script src="assets/js/write.js"></script>
  <script src="assets/js/player.js?v=8"></script>
</body>
</html>
