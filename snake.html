<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>贪吃蛇 - 日出的blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=5">
  <script>if (window.top !== window.self) document.documentElement.classList.add('is-framed');</script>
  <style>
    body { overscroll-behavior: contain; }
    .snake-wrap {
      max-width: 640px;
      margin: 24px auto;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }
    .snake-wrap h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .snake-hint {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .snake-stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .snake-stats strong { color: var(--accent); }
    #snake-canvas {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      display: block;
      margin: 0 auto;
      max-width: 100%;
      height: auto;
      touch-action: none; /* 阻止触摸 canvas 时滚动页面 */
    }
    .snake-controls {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .snake-btn {
      padding: 8px 20px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .snake-btn.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .snake-speed {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .snake-speed input { cursor: pointer; }
    /* 移动端方向键 */
    .snake-dpad {
      display: none;
      margin: 16px auto 0;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 6px;
      justify-content: center;
    }
    .snake-dpad button {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      color: var(--text);
      touch-action: none; /* 防止触摸 D-pad 时滚动/缩放 */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .snake-dpad button:active { background: var(--accent); color: #fff; }
    .snake-dpad .up { grid-column: 2; grid-row: 1; }
    .snake-dpad .left { grid-column: 1; grid-row: 2; }
    .snake-dpad .right { grid-column: 3; grid-row: 2; }
    .snake-dpad .down { grid-column: 2; grid-row: 3; }
    @media (max-width: 640px) {
      .snake-dpad { display: grid; }
    }
    .snake-gameover {
      margin-top: 12px;
      padding: 8px 16px;
      background: #ef4444;
      color: #fff;
      border-radius: 8px;
      font-weight: 700;
      display: none;
    }
    .snake-gameover.show { display: inline-block; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-title" id="site-title"></a>
      <nav>
        <a href="index.html">文章</a>
        <a href="write.html">写文章</a>
        <a href="manage.html">管理</a>
        <a href="music.html">音乐</a>
        <a href="rooms.html">房间人数查看</a>
        <a href="games.html">游戏</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="snake-wrap">
      <h1>贪吃蛇</h1>
      <p class="snake-hint">方向键 / WASD 控制，空格暂停。可穿墙（从一侧穿出，另一侧穿入），撞到自己即结束。</p>
      <div class="snake-stats">
        <div>得分：<strong id="snake-score">0</strong></div>
        <div>最高分：<strong id="snake-best">0</strong></div>
        <div class="snake-speed">
          速度：
          <input id="snake-speed" type="range" min="1" max="10" value="5">
          <span id="snake-speed-val">5</span>
        </div>
      </div>
      <canvas id="snake-canvas" width="400" height="400"></canvas>
      <div id="snake-gameover" class="snake-gameover">游戏结束！按「重新开始」再来一局</div>
      <div class="snake-controls">
        <button id="snake-start" class="snake-btn">开始</button>
        <button id="snake-pause" class="snake-btn secondary">暂停</button>
        <button id="snake-restart" class="snake-btn secondary">重新开始</button>
      </div>
      <div class="snake-dpad">
        <button class="up" data-dir="up">▲</button>
        <button class="left" data-dir="left">◀</button>
        <button class="right" data-dir="right">▶</button>
        <button class="down" data-dir="down">▼</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p id="footer-text"></p></div>
  </footer>

  <script src="assets/js/config.js?v=3"></script>
  <script src="assets/js/snake.js?v=1"></script>
  <script src="assets/js/player.js?v=13"></script>
</body>
</html>
