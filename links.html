<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>友情链接 - 日出的blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=6">
  <script>
    // 尽早应用主题（避免白屏闪烁）
    try { var _t = localStorage.getItem('blog-theme') || 'light'; if (_t !== 'auto') document.documentElement.setAttribute('data-theme', _t); } catch(e) {}
  </script>
  <script>if (window.top !== window.self) document.documentElement.classList.add('is-framed');</script>
  <style>
    body { overscroll-behavior: contain; }
    .ft-wrap { max-width: 800px; margin: 24px auto; padding: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-md); }
    .ft-wrap h1 { font-family: 'Noto Serif SC', serif; font-size: 28px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
    .ft-hint { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .link-card {
      display: flex; gap: 12px; padding: 14px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; text-decoration: none; color: inherit;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .link-card:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: var(--shadow-md); }
    .link-favicon {
      width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0;
      background: var(--tag-bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: var(--accent);
      overflow: hidden;
    }
    .link-favicon img { width: 100%; height: 100%; object-fit: contain; }
    .link-info { min-width: 0; }
    .link-name { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .link-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .empty-hint { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }
    .apply-box {
      margin-top: 20px; padding: 16px; background: var(--tag-bg);
      border: 1px dashed var(--border); border-radius: 10px;
    }
    .apply-box h3 { font-size: 14px; margin: 0 0 8px; color: var(--accent); }
    .apply-box p { font-size: 12px; color: var(--text-muted); margin: 4px 0; line-height: 1.6; }
    .apply-box code { background: var(--surface); padding: 1px 5px; border-radius: 3px; font-size: 11px; border: 1px solid var(--border); color: var(--text); }
    .is-framed .ft-wrap { margin: 8px; padding: 16px; }
  </style>
</head>
<body>
  <div class="ft-wrap">
    <h1>🔗 友情链接</h1>
    <p class="ft-hint">朋友们的博客和网站，互相串门～</p>
    <div class="links-grid" id="links-grid"><div class="empty-hint">加载中...</div></div>

    <div class="apply-box">
      <h3>想要交换友链？</h3>
      <p>如果你有博客或个人网站，欢迎在评论区留言交换！格式：</p>
      <p><code>名称：xxx<br>链接：https://xxx.com<br>简介：一句话描述</code></p>
      <p style="margin-top:8px;color:var(--text-muted)">本站信息（请先添加我）：</p>
      <p><code>名称：日出的blog<br>链接：https://sunrise150.github.io/Personal-website/<br>简介：发动一些想法，记录一些思考</code></p>
    </div>
  </div>

  <script src="assets/js/config.js?v=4"></script>
  <script>
    const links = [
      // === 在这里添加友链 ===
      // { name: '名称', url: 'https://xxx.com', desc: '一句话描述', favicon: '🔗' },
      { name: 'GitHub', url: 'https://github.com/sunrise150', desc: '我的 GitHub 主页', favicon: '🐙' },
      { name: '卡拉彼丘 Wiki', url: 'https://wiki.biligame.com/klbq', desc: '卡拉彼丘最全资料站', favicon: '🎮' },
    ];

    const grid = document.getElementById('links-grid');
    if (!links.length) {
      grid.innerHTML = '<div class="empty-hint">暂无友链，欢迎来交换！</div>';
    } else {
      grid.innerHTML = links.map(l => `
        <a class="link-card" href="${l.url}" target="_blank" rel="noopener" title="${l.desc}">
          <div class="link-favicon">
            ${l.favicon ? `<span>${l.favicon}</span>` : `<span>${l.name.charAt(0).toUpperCase()}</span>`}
          </div>
          <div class="link-info">
            <div class="link-name">${l.name}</div>
            <div class="link-desc">${l.desc}</div>
          </div>
        </a>
      `).join('');
    }
  </script>
</body>
</html>
