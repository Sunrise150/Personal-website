<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>吃豆人 - 日出的blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=6">
  <script>if (window.top !== window.self) document.documentElement.classList.add('is-framed');</script>
  <style>
    body { overscroll-behavior: contain; background: #000; }
    .pc-wrap {
      max-width: 560px;
      margin: 24px auto;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
    }
    .pc-wrap h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .pc-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .pc-stats {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .pc-stats strong { color: var(--accent); }
    #pc-canvas {
      background: #000;
      border: 2px solid var(--border);
      border-radius: 4px;
      display: block;
      margin: 0 auto;
      touch-action: none;
      max-width: 100%;
      height: auto;
    }
    .pc-controls {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .pc-btn {
      padding: 8px 20px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .pc-btn.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .pc-gameover {
      margin-top: 8px;
      padding: 8px 16px;
      background: #ef4444;
      color: #fff;
      border-radius: 8px;
      font-weight: 700;
      display: none;
    }
    .pc-gameover.show { display: inline-block; }
    .pc-win {
      margin-top: 8px;
      padding: 8px 16px;
      background: #22c55e;
      color: #fff;
      border-radius: 8px;
      font-weight: 700;
      display: none;
    }
    .pc-win.show { display: inline-block; }
    /* 移动端 D-pad */
    .pc-dpad {
      display: none;
      margin: 12px auto 0;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 6px;
      justify-content: center;
    }
    .pc-dpad button {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 20px;
      cursor: pointer;
      color: var(--text);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pc-dpad button:active { background: var(--accent); color: #fff; }
    .pc-dpad .up { grid-column: 2; grid-row: 1; }
    .pc-dpad .left { grid-column: 1; grid-row: 2; }
    .pc-dpad .right { grid-column: 3; grid-row: 2; }
    .pc-dpad .down { grid-column: 2; grid-row: 3; }
    @media (max-width: 600px) {
      .pc-dpad { display: grid; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-title" id="site-title"></a>
      <nav>
        <a href="index.html">文章</a>
        <a href="write.html">写文章</a>
        <a href="manage.html">管理</a>
        <a href="music.html">音乐</a>
        <a href="rooms.html">房间人数查看</a>
        <a href="games.html">游戏</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="pc-wrap">
      <h1>吃豆人</h1>
      <p class="pc-hint">方向键/WASD 控制。吃能量豆后幽灵变蓝可吃。穿墙隧道在左右两侧。</p>
      <div class="pc-stats">
        <div>得分：<strong id="pc-score">0</strong></div>
        <div>生命：<strong id="pc-lives">3</strong></div>
        <div>最高：<strong id="pc-best">0</strong></div>
      </div>
      <canvas id="pc-canvas" width="504" height="576"></canvas>
      <div id="pc-gameover" class="pc-gameover">游戏结束！</div>
      <div id="pc-win" class="pc-win">全部吃完！🎉</div>
      <div class="pc-controls">
        <button id="pc-start" class="pc-btn">开始</button>
        <button id="pc-pause" class="pc-btn secondary">暂停</button>
        <button id="pc-restart" class="pc-btn secondary">重新开始</button>
      </div>
      <div class="pc-dpad">
        <button class="up" data-dir="up">▲</button>
        <button class="left" data-dir="left">◀</button>
        <button class="right" data-dir="right">▶</button>
        <button class="down" data-dir="down">▼</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p id="footer-text"></p></div>
  </footer>

  <script src="assets/js/config.js?v=3"></script>
  <script src="assets/js/pacman.js?v=1"></script>
  <script src="assets/js/player.js?v=14"></script>
</body>
</html>
