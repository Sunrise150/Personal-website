<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日出的blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=4">
  <style>
    /* shell 专属：iframe 高度自适应内容，外层 body 滚动 */
    html, body { margin: 0; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .shell-frame {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      border: 0;
      display: block;
      /* 高度由 JS 根据内容自适应 */
    }
    /* shell 自身的 site-header 与子页面共用样式，无需改动 */

    /* 内置刷新按钮 */
    .shell-refresh {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: inherit;
      font-size: 16px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-left: 8px;
      transition: transform 0.6s ease, background 0.2s ease;
    }
    .shell-refresh:hover { background: rgba(255,255,255,0.12); }
    .shell-refresh.spinning { transform: rotate(360deg); }

    /* 背景流星动画：固定在视口底层，不阻挡交互 */
    .meteor-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .meteor {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px 1px rgba(255,255,255,0.6);
      opacity: 0;
    }
    .meteor::before {
      content: '';
      position: absolute;
      top: 1px;
      left: 0;
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, currentColor, transparent);
      transform-origin: left center;
      opacity: 0.6;
    }
    @keyframes meteor-fall {
      0% { opacity: 0; transform: translate(0,0) rotate(35deg) scale(0.6); }
      10% { opacity: 1; }
      100% { opacity: 0; transform: translate(-600px, 800px) rotate(35deg) scale(1); }
    }
    /* 让正文/导航等浮在流星之上 */
    .site-header, .shell-frame, .site-footer, .music-drawer { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div class="meteor-layer" id="meteor-layer" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-title" id="site-title">日出的blog</a>
      <nav id="shell-nav">
        <a href="home.html" class="active" data-path="home.html">文章</a>
        <a href="write.html" data-path="write.html">写文章</a>
        <a href="manage.html" data-path="manage.html">管理</a>
        <a href="music.html" data-path="music.html">音乐</a>
        <a href="rooms.html" data-path="rooms.html">房间人数查看</a>
        <button id="shell-refresh" class="shell-refresh" type="button" title="刷新当前页（不影响音乐）" aria-label="刷新">↻</button>
      </nav>
    </div>
  </header>

  <iframe id="content-frame" class="shell-frame" src="home.html" name="content"></iframe>

  <footer class="site-footer">
    <div class="container"><p id="footer-text">© 日出的blog</p></div>
  </footer>

  <script src="assets/js/config.js?v=3"></script>
  <script src="assets/js/player.js?v=10"></script>
  <script>
    (function () {
      const frame = document.getElementById('content-frame');
      const nav = document.getElementById('shell-nav');
      const baseLen = (SITE_CONFIG.base || '/').length;

      // 取当前路径去掉 base 前缀（如 /Personal-website/home.html → home.html）
      function stripBase(p) {
        if (!p) return '';
        if (p.charAt(0) !== '/' && p.indexOf('//') === -1) return p;
        let s = p;
        const b = SITE_CONFIG.base || '/';
        if (s.indexOf(b) === 0) s = s.slice(b.length);
        return s;
      }

      // 当前应该显示的子页面路径
      function getCurrentPath() {
        // 优先读 location.hash（如 #/post.html?slug=xxx）
        if (location.hash && location.hash.length > 2) {
          return location.hash.slice(1);
        }
        // 否则读 query ?path=
        const params = new URLSearchParams(location.search);
        const p = params.get('path');
        if (p) return p;
        return 'home.html';
      }

      // 初始加载 iframe src
      function initFrame() {
        const p = getCurrentPath();
        frame.src = p;
      }

      // iframe 加载完成后：同步外层 URL + 高亮导航 + 同步外层 title + 调整高度
      function adjustFrameHeight() {
        try {
          const doc = frame.contentDocument;
          if (!doc) return;
          const h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
          if (h > 0) frame.style.height = h + 'px';
        } catch (e) {}
      }

      frame.addEventListener('load', () => {
        let iframePath = '';
        try {
          iframePath = frame.contentWindow.location.pathname +
            frame.contentWindow.location.search;
        } catch (e) {
          return; // 跨域，忽略
        }
        const sub = stripBase(iframePath);
        if (!sub) return;

        // 用 hash 记录当前子页路径，便于分享/刷新
        const targetHash = '#' + sub;
        if (location.hash !== targetHash) {
          history.pushState({ path: sub }, '', '#' + sub);
        }

        // 高亮当前导航项
        nav.querySelectorAll('a').forEach(a => {
          a.classList.toggle('active', a.getAttribute('data-path') === sub);
        });

        // 同步外层 title
        try {
          document.title = frame.contentDocument.title || '日出的blog';
        } catch (e) {}

        // 调整 iframe 高度自适应内容
        adjustFrameHeight();

        // 监听 iframe 内 DOM 变化（如异步加载文章列表），重新调整高度
        try {
          const docEl = frame.contentDocument;
          if (docEl && !frame._obs) {
            const obs = new MutationObserver(adjustFrameHeight);
            obs.observe(docEl.body, { childList: true, subtree: true, attributes: false });
            frame._obs = obs;
            // 监听窗口 resize
            window.addEventListener('resize', adjustFrameHeight);
          }
        } catch (e) {}

        // 修复：iframe 内点击事件不会冒泡到外层 shell
        // 当抽屉展开时，用户在 iframe 内（如写文章正文）点击应让抽屉收回
        // 同时拦截 index.html 链接，避免在 iframe 内嵌套 shell
        try {
          const iframeDoc = frame.contentDocument;
          if (iframeDoc && !iframeDoc._shellClickBound) {
            iframeDoc._shellClickBound = true;
            iframeDoc.addEventListener('click', (e) => {
              // 抽屉收回
              if (window.__blogPlayer) window.__blogPlayer.collapse();
              // 拦截 index.html 链接：在 iframe 内点击应加载 home.html，不嵌套 shell
              const a = e.target.closest && e.target.closest('a[href="index.html"]');
              if (a) {
                e.preventDefault();
                frame.src = 'home.html';
              }
            });
          }
        } catch (e) {}
      });

      // 导航链接点击：让 iframe 加载新页（不整页跳转）
      nav.addEventListener('click', (e) => {
        const a = e.target.closest('a[data-path]');
        if (!a) return;
        e.preventDefault();
        const path = a.getAttribute('data-path');
        frame.src = path;
      });

      // 浏览器后退/前进：同步 iframe
      window.addEventListener('popstate', (e) => {
        const p = getCurrentPath();
        if (frame.src.indexOf(p) === -1) {
          frame.src = p;
        }
      });

      // iframe 内的链接默认会在 iframe 内打开新页（同源），无需额外处理
      // iframe load 事件会同步外层 URL

      // 内置刷新按钮：仅重载 iframe 内容，不影响外层 shell 与音乐播放
      const refreshBtn = document.getElementById('shell-refresh');
      refreshBtn.addEventListener('click', () => {
        refreshBtn.classList.add('spinning');
        // 重新设置 src 触发 reload（即使 src 相同也会刷新）
        const cur = frame.getAttribute('src');
        frame.src = 'about:blank';
        setTimeout(() => { frame.src = cur; }, 30);
        setTimeout(() => refreshBtn.classList.remove('spinning'), 700);
      });

      initFrame();
    })();

    /* ============ 背景流星：偶尔出现，不影响阅读 ============ */
    (function () {
      const layer = document.getElementById('meteor-layer');
      if (!layer) return;
      const colors = ['#ffffff', '#a8c5ff', '#ffd1a8', '#c9a8ff', '#a8ffd1'];
      function spawn() {
        const m = document.createElement('div');
        m.className = 'meteor';
        const startX = Math.random() * (window.innerWidth + 200) - 100;
        const startY = -50 - Math.random() * 200;
        m.style.left = startX + 'px';
        m.style.top = startY + 'px';
        const color = colors[Math.floor(Math.random() * colors.length)];
        m.style.color = color;
        const dur = 1.2 + Math.random() * 1.2;
        m.style.animation = `meteor-fall ${dur}s linear forwards`;
        layer.appendChild(m);
        setTimeout(() => m.remove(), dur * 1000 + 100);
      }
      // 每 4~10 秒随机一颗
      function loop() {
        spawn();
        setTimeout(loop, 4000 + Math.random() * 6000);
      }
      // 切到后台时暂停，避免堆积
      let timer = setTimeout(loop, 1500);
      document.addEventListener('visibilitychange', () => {
        clearTimeout(timer);
        if (!document.hidden) timer = setTimeout(loop, 1500);
      });
    })();
  </script>
</body>
</html>
