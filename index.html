<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日出的blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=4">
  <style>
    html, body { margin: 0; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .shell-frame {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      border: 0;
      display: block;
      min-height: calc(100vh - 180px);
    }

    .shell-refresh {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.25);
      color: inherit;
      font-size: 16px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-left: 8px;
      transition: transform 0.6s ease, background 0.2s ease;
    }
    .shell-refresh:hover { background: rgba(255,255,255,0.12); }
    .shell-refresh.spinning { transform: rotate(360deg); }

    /* ============ 标题下方版权副标题 ============ */
    .site-title.with-subtitle {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.15;
    }
    .site-title.with-subtitle::after {
      content: attr(data-subtitle);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      font-size: 10.5px;
      font-weight: 400;
      color: #78716c;
      letter-spacing: 0;
      margin-top: 2px;
      text-transform: none;
      white-space: nowrap;
    }
    @media (prefers-color-scheme: dark) {
      .site-title.with-subtitle::after { color: #a8a29e; }
    }
    /* 小屏幕上隐藏副标题，避免 header 挤压 */
    @media (max-width: 768px) {
      .site-title.with-subtitle::after { display: none; }
    }

    /* ============ 背景流星动画 ============ */
    .meteor-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }
    .meteor {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px 2px rgba(255,255,255,0.8);
      opacity: 0;
    }
    .meteor::before {
      content: '';
      position: absolute;
      top: 1px;
      left: 0;
      width: 180px;
      height: 2px;
      background: linear-gradient(90deg, currentColor, transparent);
      transform-origin: left center;
      opacity: 0.9;
      border-radius: 1px;
    }
    @keyframes meteor-fall {
      0% { opacity: 0; transform: translate(0,0) rotate(35deg) scale(0.6); }
      8% { opacity: 1; }
      100% { opacity: 0; transform: translate(-700px, 1000px) rotate(35deg) scale(1); }
    }
    .site-header, .shell-frame, .site-footer { position: relative; z-index: 1; }
    .shell-frame { background: #fafaf9; }
    body { background: #fafaf9; }

    .site-footer {
      margin-top: 0;
      border-top: 1px solid #e7e5e4;
      padding: 32px 0;
      background: #fafaf9;
    }
    .site-footer p {
      text-align: center;
      color: #78716c;
      font-size: 13px;
      margin: 0;
    }
    @media (prefers-color-scheme: dark) {
      .shell-frame, body, .site-footer { background: #0c0a09; }
      .site-footer { border-top-color: #292524; }
      .site-footer p { color: #a8a29e; }
    }
  </style>
</head>
<body>
  <div class="meteor-layer" id="meteor-layer" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="site-title" id="site-title">日出的blog</a>
      <nav id="shell-nav">
        <a href="home.html" class="active" data-path="home.html">文章</a>
        <a href="write.html" data-path="write.html">写文章</a>
        <a href="manage.html" data-path="manage.html">管理</a>
        <a href="music.html" data-path="music.html">音乐</a>
        <a href="rooms.html" data-path="rooms.html">房间人数查看</a>
        <button id="shell-refresh" class="shell-refresh" type="button" title="刷新当前页（不影响音乐）" aria-label="刷新">↻</button>
      </nav>
    </div>
  </header>

  <iframe id="content-frame" class="shell-frame" src="home.html" name="content"></iframe>

  <footer class="site-footer">
    <div class="container"><p id="footer-text"></p></div>
  </footer>

  <script src="assets/js/config.js?v=3"></script>
  <script src="assets/js/player.js?v=11"></script>
  <script>
    (function applyShellConfig() {
      const t = document.getElementById('site-title');
      const f = document.getElementById('footer-text');
      if (t && window.SITE_CONFIG) t.textContent = SITE_CONFIG.title;
      if (f && window.SITE_CONFIG) f.textContent = SITE_CONFIG.footer;

      // 关键：给外层 shell 的标题加副标题（显示版权信息）
      // 只有外层 shell 会执行到这里；iframe 内的子页面由自己的脚本处理，
      // 不会走这段逻辑，所以子页面的 "日出的blog" 下面不会多出这行小字。
      if (t && window.SITE_CONFIG) {
        t.dataset.subtitle = SITE_CONFIG.footer;
        t.classList.add('with-subtitle');
      }
    })();
  </script>
  <script>
    (function () {
      const frame = document.getElementById('content-frame');
      const nav = document.getElementById('shell-nav');

      function stripBase(p) {
        if (!p) return '';
        if (p.charAt(0) !== '/' && p.indexOf('//') === -1) return p;
        let s = p;
        const b = SITE_CONFIG.base || '/';
        if (s.indexOf(b) === 0) s = s.slice(b.length);
        return s;
      }

      function getCurrentPath() {
        if (location.hash && location.hash.length > 2) {
          return location.hash.slice(1);
        }
        const params = new URLSearchParams(location.search);
        const p = params.get('path');
        if (p) return p;
        return 'home.html';
      }

      function initFrame() {
        const p = getCurrentPath();
        frame.src = p;
      }

      function adjustFrameHeight() {
        try {
          const doc = frame.contentDocument;
          if (!doc) return;
          const h = Math.max(
            doc.body.scrollHeight,
            doc.documentElement.scrollHeight,
            doc.body.offsetHeight,
            doc.documentElement.offsetHeight
          );
          if (h > 0) {
            frame.style.height = h + 'px';
          }
        } catch (e) {}
      }

      function injectIframeStyles() {
        try {
          const doc = frame.contentDocument;
          if (!doc || doc._shellStylesInjected) return;
          doc._shellStylesInjected = true;

          const style = doc.createElement('style');
          style.textContent = `
            .site-footer { display: none !important; }
            body { min-height: 0 !important; }
          `;
          doc.head.appendChild(style);
        } catch (e) {}
      }

      frame.addEventListener('load', () => {
        let iframePath = '';
        try {
          iframePath = frame.contentWindow.location.pathname +
            frame.contentWindow.location.search;
        } catch (e) {
          return;
        }
        const sub = stripBase(iframePath);
        if (!sub) return;

        const targetHash = '#' + sub;
        if (location.hash !== targetHash) {
          history.pushState({ path: sub }, '', '#' + sub);
        }

        nav.querySelectorAll('a').forEach(a => {
          a.classList.toggle('active', a.getAttribute('data-path') === sub);
        });

        try {
          document.title = frame.contentDocument.title || '日出的blog';
        } catch (e) {}

        injectIframeStyles();

        requestAnimationFrame(() => {
          adjustFrameHeight();
          setTimeout(adjustFrameHeight, 300);
        });

        try {
          const docEl = frame.contentDocument;
          if (docEl && !frame._obs) {
            const obs = new MutationObserver(adjustFrameHeight);
            obs.observe(docEl.body, { childList: true, subtree: true, attributes: false });
            frame._obs = obs;
          }
        } catch (e) {}

        try {
          const iframeDoc = frame.contentDocument;
          if (iframeDoc && !iframeDoc._shellClickBound) {
            iframeDoc._shellClickBound = true;
            iframeDoc.addEventListener('click', (e) => {
              if (window.__blogPlayer) window.__blogPlayer.collapse();
              const a = e.target.closest && e.target.closest('a[href="index.html"]');
              if (a) {
                e.preventDefault();
                frame.src = 'home.html';
              }
            });
          }
        } catch (e) {}
      });

      window.addEventListener('resize', adjustFrameHeight);

      nav.addEventListener('click', (e) => {
        const a = e.target.closest('a[data-path]');
        if (!a) return;
        e.preventDefault();
        const path = a.getAttribute('data-path');
        frame.src = path;
      });

      window.addEventListener('popstate', (e) => {
        const p = getCurrentPath();
        if (frame.src.indexOf(p) === -1) {
          frame.src = p;
        }
      });

      const refreshBtn = document.getElementById('shell-refresh');
      refreshBtn.addEventListener('click', () => {
        refreshBtn.classList.add('spinning');
        const cur = frame.getAttribute('src');
        frame.src = 'about:blank';
        setTimeout(() => { frame.src = cur; }, 30);
        setTimeout(() => refreshBtn.classList.remove('spinning'), 700);
      });

      initFrame();
    })();

    /* 背景流星 */
    (function () {
      const layer = document.getElementById('meteor-layer');
      if (!layer) return;
      const colors = ['#ffffff', '#a8c5ff', '#ffd1a8', '#c9a8ff', '#a8ffd1', '#ffaecc'];
      function spawn() {
        const m = document.createElement('div');
        m.className = 'meteor';
        const startX = Math.random() * (window.innerWidth + 300) - 150;
        const startY = -100 - Math.random() * 300;
        m.style.left = startX + 'px';
        m.style.top = startY + 'px';
        const color = colors[Math.floor(Math.random() * colors.length)];
        m.style.color = color;
        const dur = 1.6 + Math.random() * 1.6;
        m.style.animation = `meteor-fall ${dur}s linear forwards`;
        layer.appendChild(m);
        setTimeout(() => m.remove(), dur * 1000 + 100);
      }
      function loop() {
        spawn();
        setTimeout(loop, 1500 + Math.random() * 2500);
      }
      let timer = setTimeout(loop, 800);
      document.addEventListener('visibilitychange', () => {
        clearTimeout(timer);
        if (!document.hidden) timer = setTimeout(loop, 800);
      });
    })();
  </script>
</body>
</html>
